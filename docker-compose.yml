services:
  goapp:
    build:
      context: .
      args:
        VERSION: ${VERSION:-v1.0.0}
        BUILD_TIME: ${BUILD_TIME}
    container_name: goapp
    restart: unless-stopped
    depends_on:
      seaweedfs:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=8080
      - GIN_MODE=release
      - MONGODB_HOST=mongo:27017
      - SEAWEEDFS_ENDPOINT=seaweedfs:9000
    expose:
      - "8080"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  boomerang-worker:
    build:
      context: .
      args:
        VERSION: ${VERSION:-v1.0.0}
        BUILD_TIME: ${BUILD_TIME}
    container_name: boomerang-worker
    restart: unless-stopped
    depends_on:
      seaweedfs:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - WORKER_MODE=all
      - MONGODB_HOST=mongo:27017
      - SEAWEEDFS_ENDPOINT=seaweedfs:9000
    networks:
      - app-network

  mongo:
    image: mongo:8.0
    container_name: mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:?Set MONGODB_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-snappsy}
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: unless-stopped
    command: >
      mini -dir=/data
      -s3.port=9000
      -admin.port=9001
      -admin.password=${SEAWEEDFS_ADMIN_PASSWORD:?Set SEAWEEDFS_ADMIN_PASSWORD in .env}
      -admin.port.legacy=0
      -s3.port.iceberg=0
      -s3.port.lance=0
      -webdav=false
      -master.telemetry=false
    expose:
      - "9000"
      - "9001"
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:?Set SEAWEEDFS_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:?Set SEAWEEDFS_SECRET_KEY in .env}
      S3_BUCKET: ${SEAWEEDFS_BUCKET:-images}
      S3_EXTERNAL_URL: ${SEAWEEDFS_PUBLIC_URL:-}
    volumes:
      - seaweedfs_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      FILES_DOMAIN: ${FILES_DOMAIN:-files.localhost}
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:-console.localhost}
    command: >
      /bin/sh -c "sed
      -e 's|__API_DOMAIN__|${API_DOMAIN:-api.localhost}|g'
      -e 's|__FILES_DOMAIN__|${FILES_DOMAIN:-files.localhost}|g'
      -e 's|__CONSOLE_DOMAIN__|${CONSOLE_DOMAIN:-console.localhost}|g'
      /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - goapp
      - seaweedfs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health-check"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network

volumes:
  seaweedfs_data:
  mongo_data:

networks:
  app-network:
    driver: bridge
