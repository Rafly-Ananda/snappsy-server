name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: bash -n scripts/smoke.sh scripts/backup.sh scripts/restore.sh scripts/dev-backup.sh scripts/dev-restore.sh
