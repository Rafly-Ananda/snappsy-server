services:
  goapp:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        GO_VERSION: 1.24
    container_name: goapp-dev
    restart: unless-stopped
    depends_on:
      - seaweedfs
      - mongo
    env_file:
      - .env
    environment:
      - PORT=8080
      - GIN_MODE=debug
      - ENV=development
      - MONGODB_HOST=mongo:27017
      - SEAWEEDFS_ENDPOINT=seaweedfs:9000
      - SEAWEEDFS_PUBLIC_URL=http://localhost:9000
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/tmp
    working_dir: /app
    command: air -c .air.toml
    networks:
      - app-network

  boomerang-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        GO_VERSION: 1.24
    container_name: boomerang-worker-dev
    restart: unless-stopped
    depends_on:
      - seaweedfs
      - mongo
    env_file:
      - .env
    environment:
      - WORKER_MODE=all
      - MONGODB_HOST=mongo:27017
      - SEAWEEDFS_ENDPOINT=seaweedfs:9000
      - SEAWEEDFS_PUBLIC_URL=http://localhost:9000
    volumes:
      - .:/app
      - /app/tmp
    working_dir: /app
    command: go run ./cmd/server
    networks:
      - app-network

  mongo:
    image: mongo:8.0
    container_name: mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:?Set MONGODB_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-snappsy}
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - app-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGODB_USERNAME:?Set MONGODB_USERNAME in .env}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in .env}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongo
    networks:
      - app-network

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-dev
    restart: unless-stopped
    command: >
      mini -dir=/data
      -s3.port=9000
      -admin.port=9001
      -admin.password=${SEAWEEDFS_ADMIN_PASSWORD:-snappsy-dev-admin}
      -admin.port.legacy=0
      -s3.port.iceberg=0
      -s3.port.lance=0
      -webdav=false
      -master.telemetry=false
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-snappsy-access-key}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-snappsy-secret-key}
      S3_BUCKET: ${SEAWEEDFS_BUCKET:-images}
      S3_EXTERNAL_URL: http://localhost:9000
    volumes:
      - seaweedfs_data_dev:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6378:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - app-network
    command: redis-server --appendonly yes

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-network

volumes:
  seaweedfs_data_dev:
    driver: local
  mongo_data_dev:
    driver: local
  redis_data_dev:
    driver: local

networks:
  app-network:
    driver: bridge
